name: Release

# Publishing a version: push a tag such as v1.0.12 (the number must match <Version> in the two .csproj files).
# This runs the tests, builds the single-file EQOverwatch.exe and attaches it (with its SHA-256 file, which the app's Install update button checks) to a GitHub release, which is what
# the app's "new version available" check looks for.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($project in 'src/EQOverwatch.App/EQOverwatch.App.csproj', 'src/EQOverwatch.Core/EQOverwatch.Core.csproj') {
            $xml = [xml](Get-Content $project)
            $version = @($xml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
            if ($tag -ne $version) { throw "Tag v$tag does not match <Version> $version in $project" }
          }

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/EQOverwatch.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "EQOverwatch-${{ github.ref_name }}-win-x64.zip"

      - name: Checksum
        shell: pwsh
        run: |
          $zip = "EQOverwatch-${{ github.ref_name }}-win-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "EQOverwatch-${{ github.ref_name }}-win-x64.zip" "EQOverwatch-${{ github.ref_name }}-win-x64.zip.sha256" --title "EQ Overwatch ${{ github.ref_name }}" --generate-notes

      # The Windows installer (per-user, no admin), built after the release exists so a problem here never holds the release back. It
      # takes the edition's name and folder from Core/Edition.cs.
      - name: Installer
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $edition = Get-Content src/EQOverwatch.Core/Edition.cs -Raw
          $name = [regex]::Match($edition, 'const string Name = "([^"]+)"').Groups[1].Value
          $folder = [regex]::Match($edition, 'const string SettingsFolderName = "([^"]+)"').Groups[1].Value
          $repo = [regex]::Match($edition, 'const string Repository = "([^"]+)"').Groups[1].Value
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Tools.InnoSetup/6.7.3 -OutFile inno.zip
          Expand-Archive inno.zip -DestinationPath inno
          $setup = "$folder-Setup-${{ github.ref_name }}"
          & inno/tools/ISCC.exe /Q "/DAppName=$name" "/DAppVersion=$version" "/DAppFolder=$folder" "/DRepository=$repo" "/DSourceDir=$PWD\publish" "/DOutputName=$setup" "/O$PWD" installer/EQOverwatch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $hash = (Get-FileHash "$setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $setup.exe" | Out-File -Encoding ascii "$setup.exe.sha256"
          gh release upload "${{ github.ref_name }}" "$setup.exe" "$setup.exe.sha256"

      # Posts the release to the Discord channel whose webhook is in the DISCORD_RELEASE_WEBHOOK secret (skipped when there is none).
      # The post has this version's changelog lines from README.md and the download links; the version named in FULL_CHANGELOG_TAG
      # posts the whole changelog instead. A failure here never holds the release back.
      - name: Discord post
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          FULL_CHANGELOG_TAG: v1.0.108
        run: |
          if (-not $env:WEBHOOK) { Write-Host "No Discord webhook set; nothing posted."; exit 0 }
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $edition = Get-Content src/EQOverwatch.Core/Edition.cs -Raw
          $name = [regex]::Match($edition, 'const string Name = "([^"]+)"').Groups[1].Value

          # The changelog: "### heading" sections between "## Changelog" and the next "## ".
          $readme = Get-Content README.md -Raw
          $log = [regex]::Match($readme, '(?s)## Changelog\s*(.*?)(?=\n## |\z)').Groups[1].Value
          $sections = [regex]::Matches($log, '(?s)### ([^\r\n]+)\s*(.*?)(?=\n### |\z)') | ForEach-Object {
            [pscustomobject]@{ Title = $_.Groups[1].Value.Trim(); Body = $_.Groups[2].Value.Trim() } }
          $current = $sections | Where-Object { $_.Title -eq $version } | Select-Object -First 1
          if (-not $current) { Write-Host "No changelog section for $version; nothing posted."; exit 0 }

          $release = gh release view $tag --json url,assets | ConvertFrom-Json
          $setup = $release.assets | Where-Object { $_.name -like '*-Setup-*.exe' } | Select-Object -First 1
          $zip = $release.assets | Where-Object { $_.name -like '*-win-x64.zip' } | Select-Object -First 1
          $links = @()
          if ($setup) { $links += "[$($setup.name)]($($setup.url))" }
          if ($zip) { $links += "[$($zip.name)]($($zip.url))" }
          $main = @{
            title = "$name $tag is out"; url = $release.url; color = 6514417
            description = "$($current.Body)`n`nUpdate from inside the app with **Install update**, or download:`n" + ($links -join '   |   ')
          }
          $embeds = @($main)
          if ($tag -eq $env:FULL_CHANGELOG_TAG) {
            foreach ($section in $sections | Where-Object { $_.Title -ne $version }) {
              $embeds += @{ title = $section.Title; description = $section.Body; color = 3092790 }
            }
          }

          # Discord takes at most 10 embeds and about 6,000 characters per message: send them in as many posts as needed, in order.
          $batch = @(); $size = 0
          function Send($items) {
            $body = @{ username = "$name Updates"; embeds = $items; allowed_mentions = @{ parse = @() } } | ConvertTo-Json -Depth 6
            Invoke-RestMethod -Uri $env:WEBHOOK -Method Post -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body)) | Out-Null
            Start-Sleep -Seconds 2
          }
          foreach ($embed in $embeds) {
            $length = $embed.title.Length + $embed.description.Length
            if ($batch.Count -ge 10 -or ($size + $length) -gt 5500) { Send $batch; $batch = @(); $size = 0 }
            $batch += $embed; $size += $length
          }
          if ($batch.Count -gt 0) { Send $batch }
          Write-Host "Posted $($embeds.Count) section(s) to Discord."
